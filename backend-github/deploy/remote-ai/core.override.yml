# Merge after the existing isolated Compose configuration. Does not declare ports, volumes or GPU services.
services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod,docker,remote-ai
      WGAI_INFERENCE_MODE: ${WGAI_INFERENCE_MODE:-disabled}
      WGAI_INFERENCE_PROVIDER_KEY: ${WGAI_INFERENCE_PROVIDER_KEY:-remote}
      WGAI_INFERENCE_BASE_URL: ${WGAI_INFERENCE_BASE_URL:-}
      WGAI_INFERENCE_APPROVED_ORIGIN: ${WGAI_INFERENCE_APPROVED_ORIGIN:-}
      WGAI_INFERENCE_API_PATH: ${WGAI_INFERENCE_API_PATH:-/infer}
      WGAI_INFERENCE_VIDEO_API_PATH: ${WGAI_INFERENCE_VIDEO_API_PATH:-/video-jobs}
      WGAI_INFERENCE_STREAM_SOURCES_PATH: ${WGAI_INFERENCE_STREAM_SOURCES_PATH:-/stream-sources}
      WGAI_INFERENCE_STREAM_SESSIONS_PATH: ${WGAI_INFERENCE_STREAM_SESSIONS_PATH:-/stream-sessions}
      WGAI_INFERENCE_TOKEN_FILE: ${WGAI_INFERENCE_TOKEN_FILE:-/run/secrets/wgai-inference-token}
      WGAI_INFERENCE_CA_FILE: ${WGAI_INFERENCE_CA_FILE:-}
      WGAI_INFERENCE_CONNECT_TIMEOUT_MS: ${WGAI_INFERENCE_CONNECT_TIMEOUT_MS:-3000}
      WGAI_INFERENCE_REQUEST_TIMEOUT_MS: ${WGAI_INFERENCE_REQUEST_TIMEOUT_MS:-120000}
      WGAI_INFERENCE_TRANSFER_TIMEOUT_MS: ${WGAI_INFERENCE_TRANSFER_TIMEOUT_MS:-30000}
      WGAI_INFERENCE_MAX_INFLIGHT: ${WGAI_INFERENCE_MAX_INFLIGHT:-1}
      WGAI_INFERENCE_UPLOAD_MAX_BYTES: ${WGAI_INFERENCE_UPLOAD_MAX_BYTES:-10485760}
      WGAI_INFERENCE_OUTPUT_MAX_BYTES: ${WGAI_INFERENCE_OUTPUT_MAX_BYTES:-10485760}
      WGAI_INFERENCE_VIDEO_UPLOAD_MAX_BYTES: ${WGAI_INFERENCE_VIDEO_UPLOAD_MAX_BYTES:-536870912}
      WGAI_INFERENCE_VIDEO_OUTPUT_MAX_BYTES: ${WGAI_INFERENCE_VIDEO_OUTPUT_MAX_BYTES:-536870912}
    volumes:
      - type: bind
        source: ${WGAI_REMOTE_AI_CONFIG_FILE:?absolute path to application-remote-ai.yml required}
        target: /app/config/application-remote-ai.yml
        read_only: true
