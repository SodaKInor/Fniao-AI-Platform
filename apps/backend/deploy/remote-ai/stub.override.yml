# Development only. Include this file explicitly and enable profile remote-ai-stub.
services:
  remote-ai-stub:
    profiles: [remote-ai-stub]
    image: wgai-remote-ai-stub:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend-github
      dockerfile: integrations/ai-contracts/stub/Dockerfile
    restart: unless-stopped
    environment:
      WGAI_STUB_HOST: 0.0.0.0
      WGAI_STUB_PORT: 18080
      WGAI_STUB_TOKEN: wgai-explicit-development-stub-token
      WGAI_STUB_MAX_BODY_BYTES: 33554432
      WGAI_STUB_DEFAULT_SCENARIO: ${WGAI_STUB_DEFAULT_SCENARIO:-success}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 2s
    networks: [app]

  backend:
    environment:
      WGAI_INFERENCE_MODE: remote
      WGAI_INFERENCE_DEVELOPMENT_STUB: "true"
      WGAI_INFERENCE_PROVIDER_KEY: stub
      WGAI_INFERENCE_BASE_URL: http://remote-ai-stub:18080/
      WGAI_INFERENCE_APPROVED_ORIGIN: http://remote-ai-stub:18080/
      WGAI_INFERENCE_TOKEN_FILE: /run/secrets/wgai-development-stub-token
      WGAI_INFERENCE_CA_FILE: ""
    volumes:
      - type: bind
        source: ../backend-github/deploy/remote-ai/stub-token.dev
        target: /run/secrets/wgai-development-stub-token
        read_only: true
